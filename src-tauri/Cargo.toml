[package]
name = "orange-run-notes"
version = "0.13.0"
description = "A quiet local-first notes app"
authors = ["Peter"]
edition = "2021"
license = "MIT"

[lib]
name = "orange_run_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
futures-util = "0.3"
machine-uid = "0.5"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"
